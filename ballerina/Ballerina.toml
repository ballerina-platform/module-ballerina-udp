[package]
org = "ballerina"
name = "udp"
version = "1.14.0"
authors = ["Ballerina"]
keywords = ["UDP", "datagram", "transport", "Type/Connector", "Type/Trigger", "Area/Built-in", "Area/Communication", "Name/UDP"]
repository = "https://github.com/ballerina-platform/module-ballerina-udp"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.14.0"
include = ["metadata/**"]

[platform.java25]
graalvmCompatible = true

[[platform.java25.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "udp-native"
version = "1.14.0"
path = "../native/build/libs/udp-native-1.14.0-SNAPSHOT.jar"

[[platform.java21.dependency]]
path = "../test-utils/build/libs/udp-test-utils-1.14.0-SNAPSHOT.jar"
scope = "testOnly"

[[platform.java25.dependency]]
groupId = "io.netty"
artifactId = "netty-handler"
version = "4.2.18.Final"
path = "./lib/netty-handler-4.2.18.Final.jar"

[[platform.java25.dependency]]
groupId = "io.netty"
artifactId = "netty-buffer"
version = "4.2.18.Final"
path = "./lib/netty-buffer-4.2.18.Final.jar"

[[platform.java25.dependency]]
groupId = "io.netty"
artifactId = "netty-transport"
version = "4.2.18.Final"
path = "./lib/netty-transport-4.2.18.Final.jar"

[[platform.java25.dependency]]
groupId = "io.netty"
artifactId = "netty-common"
version = "4.2.18.Final"
path = "./lib/netty-common-4.2.18.Final.jar"

[[platform.java25.dependency]]
groupId = "io.netty"
artifactId = "netty-resolver"
version = "4.2.18.Final"
path = "./lib/netty-resolver-4.2.18.Final.jar"
